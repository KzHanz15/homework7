<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星球宇宙 · A-Frame 自主实践</title>
  <!-- A-Frame 使用 CDN 在线引入 -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <style>
    #tip {
      position: fixed; left: 14px; top: 14px; color: #cde6ff; z-index: 10;
      font: 14px/1.7 "Microsoft YaHei", sans-serif; pointer-events: none;
      text-shadow: 0 0 6px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>
  <div id="tip">🌌 星球宇宙（A-Frame 版）<br>
    <span style="font-size:12px;opacity:.85">WASD 走动 · 鼠标环顾 · 点击太阳观察自发光</span>
  </div>

  <a-scene>
    <!-- 环境：深空天空 + 深色地面 -->
    <a-sky color="#05070f"></a-sky>
    <a-plane position="0 0 -30" rotation="-90 0 0" width="120" height="120" color="#0b1020"></a-plane>

    <!-- 太阳：自发光球体 + 点光源 -->
    <a-entity position="0 6 -18"
              light="type: point; color: #fff; intensity: 1.8; distance: 60">
      <a-sphere radius="3.5" color="#ffcc33"
                animation="property: scale; to: 3.7 3.7 3.7; dir: alternate; dur: 2000; loop: true"></a-sphere>
    </a-entity>

    <!-- 地球：绕太阳公转，自转并斜轴倾 -->
    <a-entity rotation="0 0 0" animation="property: rotation; to: 0 360 0; dur: 26000; loop: true; easing: linear">
      <a-entity position="12 6 -18" rotation="0 0 23.5">
        <a-sphere radius="1.6" color="#3f7fd3"></a-sphere>
        <!-- 月球：绕地球转 -->
        <a-entity animation="property: rotation; to: 0 360 0; dur: 6000; loop: true; easing: linear">
          <a-sphere position="2.4 0 0" radius="0.5" color="#cccccc"></a-sphere>
        </a-entity>
      </a-entity>
    </a-entity>

    <!-- 带光环的行星 -->
    <a-entity rotation="0 0 0" animation="property: rotation; to: 0 360 0; dur: 42000; loop: true; easing: linear">
      <a-entity position="24 6 -18" rotation="0 0 15">
        <a-sphere radius="2.4" color="#d8a24b"></a-sphere>
        <a-ring radius="3.2" radius-tubular="4.6" rotation="-90 0 0" color="#cfa064"></a-ring>
      </a-entity>
    </a-entity>

    <!-- 远处分布的小行星（多个小方块，构成点缀） -->
    <a-box position="-16 8 -26" width="0.7" height="0.7" depth="0.7" color="#8a8f98"></a-box>
    <a-box position="18 12 -30" width="0.9" height="0.9" depth="0.9" color="#7a7f88"></a-box>
    <a-box position="6 2 -36" width="0.5" height="0.5" depth="0.5" color="#9a9fa8"></a-box>
    <a-box position="-24 4 -22" width="1.0" height="1.0" depth="1.0" color="#6a6f78"></a-box>

    <!-- 环境光 -->
    <a-light type="ambient" color="#ffffff" intensity="0.5"></a-light>

    <!-- 相机初始位 -->
    <a-camera position="0 1.8 0"></a-camera>
  </a-scene>
</body>
</html>
